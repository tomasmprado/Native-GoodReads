name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub's macos runners ship full Xcode, not just the Command Line
    # Tools — unlike a from-source build on a machine with only CLT (see
    # README's Build section), `swift build`/`swift test` just work here.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test
