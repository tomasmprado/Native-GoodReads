name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub's macos runners ship full Xcode, not just the Command Line
    # Tools — unlike a from-source build on a machine with only CLT (see
    # README's Build section), `swift build`/`swift test` just work here.
    # macos-26 has Xcode 26 and its SDK, so the Liquid Glass code (behind
    # `#if compiler(>=6.2)` in Glass.swift) is compiled here, not skipped.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  ios-build:
    # The iOS app compiles the same sources through GoodreadsiOS.xcodeproj
    # (generated from project.yml by XcodeGen). Built for the simulator, so
    # no signing is needed.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator
        run: >
          xcodebuild -project GoodreadsiOS.xcodeproj -scheme GoodreadsiOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
