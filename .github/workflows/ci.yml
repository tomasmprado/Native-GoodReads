name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub's macos runners ship full Xcode, not just the Command Line
    # Tools — unlike a from-source build on a machine with only CLT (see
    # README's Build section), `swift build`/`swift test` just work here.
    # macos-26 has Xcode 26 and its SDK, so the Liquid Glass code (behind
    # `#if compiler(>=6.2)` in Glass.swift) is compiled here, not skipped.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The widget extension isn't a SwiftPM target (SwiftPM can't build an
      # .appex), so it's compiled on its own here to catch breakage.
      - name: Build widget
        run: |
          xcrun swiftc -c -wmo -module-name GoodreadsWidget -swift-version 6 \
            -parse-as-library -application-extension \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" -target arm64-apple-macos13.0 \
            -o "$RUNNER_TEMP/widget.o" \
            Sources/GoodreadsWidget/*.swift Sources/GoodreadsGUI/WidgetData.swift
