# The iOS app's Xcode project, generated by XcodeGen:
#
#   xcodegen generate
#
# GoodreadsiOS.xcodeproj is committed too, so building only needs Xcode.
# It compiles the same Sources/GoodreadsGUI as the Mac app; Mac-only files
# are behind `#if os(macOS)` and iOSApp.swift is the entry point.
name: GoodreadsiOS
options:
  bundleIdPrefix: local.goodreads
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GoodreadsiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/GoodreadsGUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.goodreads.ios
        PRODUCT_NAME: Goodreads
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goodreads
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # CSV exports land in the app's Documents folder; these show it in Files.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleLocalizations: "en pt"
